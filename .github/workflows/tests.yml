name: Test

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - uv.lock
      - pyproject.toml
      - ".github/workflows/tests.yml"
      - "!docs/**"
  pull_request:
    # types: opened
    branches: [main]
    paths:
      - "**.py"
      - uv.lock
      - pyproject.toml
      - ".github/workflows/tests.yml"
      - "!docs/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-seed-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.extract-version-range.outputs.versions }}
    steps:
      # The LLVM versions that clang-tools-static-binaries currently builds,
      # from its index rather than from its "latest" GitHub release.
      - name: Extract version range
        id: extract-version-range
        shell: python
        run: |-
          import json
          from os import environ
          from urllib.request import urlopen
          url = "https://cpp-linter.github.io/clang-tools-static-binaries/index.json"
          with urlopen(url, timeout=60) as response:
              index = json.load(response)
          versions = sorted(index["versions"], key=int)
          with open(environ["GITHUB_OUTPUT"], mode="a") as gh_out:
              gh_out.write(f"versions={json.dumps(versions)}\n")
  test:
    needs: pre-seed-versions
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest']
        version: ${{ fromJSON(needs.pre-seed-versions.outputs.versions) }}
    env:
      MAX_PYTHON_VERSION: '3.16'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install ninja-build
      - name: Install ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Linux clang dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          CLANG_VERSION: ${{ matrix.version }}
        run: |
          sudo apt-get update
          # First try installing from default Ubuntu repositories before trying LLVM script
          if ! sudo apt-get install -y clang-format-${CLANG_VERSION} clang-tidy-${CLANG_VERSION}; then
            # This LLVM script will add the relevant LLVM PPA: https://apt.llvm.org/
            wget https://apt.llvm.org/llvm.sh -O ${{ runner.temp }}/llvm_install.sh
            chmod +x ${{ runner.temp }}/llvm_install.sh
            if sudo ${{ runner.temp }}/llvm_install.sh ${CLANG_VERSION}; then
              sudo apt-get install -y clang-format-${CLANG_VERSION} clang-tidy-${CLANG_VERSION}
            fi
          fi

      - name: Install clang-tools
        shell: bash
        env:
          CLANG_VERSION: ${{ matrix.version }}
        run: |
          python -m pip install clang-tools
          clang-tools install clang-format clang-tidy --version "${CLANG_VERSION}"

      - name: Is clang-only tests?
        id: clang-dep
        shell: python
        env:
          CLANG_VERSION: ${{ matrix.version }}
        run: |-
          from os import environ
          with open(environ["GITHUB_OUTPUT"], mode="a") as gh_out:
            curr_test_ver = environ["CLANG_VERSION"]
            if curr_test_ver == "21":
                gh_out.write("args=\n")
            else:
                gh_out.write("args=not no_clang\n")

      - name: Collect Coverage
        shell: bash
        env:
          CLANG_VERSION: ${{ matrix.version }}
          PYTEST_ARGS: ${{ steps.clang-dep.outputs.args }}
        run: uvx nox -s test-all -- -m "${PYTEST_ARGS}"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ runner.os }}-${{ matrix.version }}
          path: .coverage*
          include-hidden-files: true

  coverage-report:
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: test-coverage
      url: https://app.codecov.io/gh/cpp-linter/cpp-linter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create coverage report
        run: uvx nox -s coverage

      - name: Upload comprehensive coverage HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: htmlcov/

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
        with:
          files: ./coverage.xml
          fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)
